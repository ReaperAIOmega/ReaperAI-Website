name: ReaperAI Website Verify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify static application
        run: node scripts/verify-static.mjs
      - name: Verify free credit scope and written-only offer
        run: node scripts/check-public-scope.mjs && node scripts/check-written-launch.mjs && node scripts/check-funding-intake.mjs
