name: ReaperAI Website Verify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify static application
        run: node scripts/verify-static.mjs
      - name: Verify launch offer boundaries
        run: node --test scripts/verify-launch-offers.test.mjs
