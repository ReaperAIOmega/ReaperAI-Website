<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Johnson Strategic Solutions | Client Intake</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="navbar" data-navbar="navbar-public.html"></div>

  <main class="form-card">
    <h1 class="center mt-0">Client Intake Form</h1>
    <p class="center">
      Submit your details so Johnson Strategic Solutions can review your situation, assign the correct service path, and prepare the next step.
    </p>

    <form id="intake-form" novalidate>
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" autocomplete="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" required>

      <label for="phone">Phone</label>
      <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" autocomplete="tel">

      <label for="state">State of Residence</label>
      <select id="state" name="state" autocomplete="address-level1" required>
        <option value="">Select state</option>
        <option value="AL">Alabama</option><option value="AK">Alaska</option><option value="AZ">Arizona</option><option value="AR">Arkansas</option>
        <option value="CA">California</option><option value="CO">Colorado</option><option value="CT">Connecticut</option><option value="DE">Delaware</option>
        <option value="DC">District of Columbia</option><option value="FL">Florida</option><option value="GA">Georgia</option><option value="HI">Hawaii</option>
        <option value="ID">Idaho</option><option value="IL">Illinois</option><option value="IN">Indiana</option><option value="IA">Iowa</option>
        <option value="KS">Kansas</option><option value="KY">Kentucky</option><option value="LA">Louisiana</option><option value="ME">Maine</option>
        <option value="MD">Maryland</option><option value="MA">Massachusetts</option><option value="MI">Michigan</option><option value="MN">Minnesota</option>
        <option value="MS">Mississippi</option><option value="MO">Missouri</option><option value="MT">Montana</option><option value="NE">Nebraska</option>
        <option value="NV">Nevada</option><option value="NH">New Hampshire</option><option value="NJ">New Jersey</option><option value="NM">New Mexico</option>
        <option value="NY">New York</option><option value="NC">North Carolina</option><option value="ND">North Dakota</option><option value="OH">Ohio</option>
        <option value="OK">Oklahoma</option><option value="OR">Oregon</option><option value="PA">Pennsylvania</option><option value="RI">Rhode Island</option>
        <option value="SC">South Carolina</option><option value="SD">South Dakota</option><option value="TN">Tennessee</option><option value="TX">Texas</option>
        <option value="UT">Utah</option><option value="VT">Vermont</option><option value="VA">Virginia</option><option value="WA">Washington</option>
        <option value="WV">West Virginia</option><option value="WI">Wisconsin</option><option value="WY">Wyoming</option>
      </select>

      <label for="serviceNeeded">Service Needed</label>
      <select id="serviceNeeded" name="serviceNeeded" required>
        <option value="">Select a service</option>
        <option value="Credit Audit">Credit Audit</option>
        <option value="Credit Repair">Credit Repair</option>
        <option value="Business Setup">Business Setup</option>
        <option value="Business Funding">Business Funding</option>
        <option value="Automation / AI Systems">Automation / AI Systems</option>
        <option value="Platform Setup">Platform Setup</option>
        <option value="Consultation">Consultation</option>
        <option value="Custom Service">Custom Service</option>
      </select>

      <label for="creditScore">Estimated Credit Score</label>
      <input type="text" id="creditScore" name="creditScore" placeholder="Example: 650" inputmode="numeric">

      <label for="fundingAmount">Funding Amount Needed</label>
      <input type="text" id="fundingAmount" name="fundingAmount" placeholder="Example: 25000" inputmode="decimal">

      <label for="businessStatus">Business Status</label>
      <select id="businessStatus" name="businessStatus">
        <option value="">Select current status</option>
        <option value="No business yet">No business yet</option>
        <option value="LLC formed">LLC formed</option>
        <option value="EIN obtained">EIN obtained</option>
        <option value="Business bank account open">Business bank account open</option>
        <option value="Already generating revenue">Already generating revenue</option>
      </select>

      <label for="notes">Situation / Notes</label>
      <textarea id="notes" name="notes" placeholder="Explain your situation, goals, credit issues, funding needs, or platform objectives."></textarea>

      <div aria-hidden="true" style="position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden;">
        <label for="companyWebsite">Company Website</label>
        <input type="text" id="companyWebsite" name="companyWebsite" tabindex="-1" autocomplete="off">
      </div>

      <div class="buttons" style="margin-top: 14px;">
        <button type="submit" class="button" id="submit-btn">Submit Intake</button>
        <a href="index.html" class="btn-secondary">Return Home</a>
      </div>

      <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
    </form>
  </main>

  <div class="footer">© Johnson Strategic Solutions</div>

  <script src="load-navbar.js"></script>
  <script type="module" src="intake.js"></script>
</body>
</html>
