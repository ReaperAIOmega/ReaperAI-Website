<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Johnson Strategic Solutions | Secure Sign In</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="navbar" data-navbar="navbar-public.html"></div>

  <div class="form-card" style="max-width: 460px; margin-top: 120px;">
    <h2 class="center">Secure Client Sign In</h2>
    <p class="center">
      Enter the email attached to your Johnson Strategic Solutions account. We will send a secure one-time sign-in link.
    </p>

    <form id="login-form">
      <label for="login-email">Email</label>
      <input id="login-email" type="email" name="email" placeholder="Enter your email" autocomplete="email" required>

      <button id="login-submit" type="submit" class="button" style="width: 100%;">Send secure sign-in link</button>
      <p id="login-status" class="status-message" role="status" aria-live="polite" style="margin-top:16px;"></p>
    </form>

    <div class="center" style="margin-top: 18px;">
      <a href="intake.html" style="display:block; margin-top:8px; color:#7fb8ff; text-decoration:none;">
        Not a client yet? Start with intake
      </a>
    </div>
  </div>

  <div class="footer">© Johnson Strategic Solutions</div>

  <script src="load-navbar.js"></script>
  <script type="module" src="auth-login.js"></script>
</body>
</html>
